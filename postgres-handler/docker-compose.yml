version: '3.8'

services:
  pos-handler:
    build: .
    container_name: pos-handler
    working_dir: /app
    # 启动命令：运行镜像内构建的二进制文件
    command: ["./postgres-handler"]

    # 环境变量（可从 .env 文件加载，也可在这里覆盖）
    environment:
      - TZ=Asia/Shanghai
      - PORT=8080
      - MTF_SERVICE_TOKEN=${MTF_SERVICE_TOKEN:-fintrack-dev-token}
      - A_STOCK_DAILY_URL=${A_STOCK_DAILY_URL:-http://a-stock-daily:8080}
      - A_STOCK_DAILY_TOKEN=${A_STOCK_DAILY_TOKEN:-fintrack-dev-token}
      - HISTORY_PROVIDER_ORDER=${HISTORY_PROVIDER_ORDER:-tickflow,daily,eastmoney,baidu}

    # 端口映射
    ports:
      - "58005:8080"

    # # 健康检查
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:$${PORT:-8080}/health"]
    #   interval: 30s
    #   timeout: 10s
    #   start_period: 5s
    #   retries: 3
